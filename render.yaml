services:
  - type: web
    name: climate-hazard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_DATABASE
        value: climate_hazard
      - key: ALLOWED_ORIGINS
        value: "*"
