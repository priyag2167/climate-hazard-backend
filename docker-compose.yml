# Local development only. Never expose an unauthenticated MongoDB port publicly.
services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: climate_hazard
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
